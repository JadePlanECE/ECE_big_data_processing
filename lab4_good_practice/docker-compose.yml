services:
  kafka:
    image: apache/kafka-native:4.1.1
    container_name: kafka_container
    ports:
      - "9092:9092"          # accès depuis l'hôte si besoin
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    command: python admin.py

  producer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./data:/data
    command: python producer.py

  consumer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./data:/data
    command: python consumer.py